<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jodrell</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/jodrell-32.png">
<link rel="apple-touch-icon" href="/icons/jodrell-256.png">
<style>
@font-face { font-family: "Pixelify Sans"; src: url("/fonts/PixelifySans.ttf") format("truetype"); font-weight: 400 700; font-display: swap; }
:root {
  color-scheme: light;
  --bg: #FCFBF4; --surface: #F2F5E9; --chrome: #E8F1DA; --chrome-2: #D8E8C2; --raised: #FFFFFF;
  --ink: #1E2A16; --muted: #56634B; --faint: #8A957E; --line: #DCE3CF; --line-strong: #A7B796;
  --hover: #FFF5D1; --hover-line: #EBD58A; --select: #D8ECC2; --select-line: #86B85A;
  --accent: #2F7D32; --accent-ink: #FFFFFF; --group: #2E5E1E;
  --ok: #2E7D32; --redirect: #1F7A7A; --warn: #A0620A; --err: #B83A26; --schema: #7B4BB0;
  --get: #2E7D32; --post: #A0620A; --put: #1E6FA8; --patch: #7B4BB0; --delete: #B83A26; --other: #56634B;
  --folder: #E8B54A; --folder-back: #C98F2C; --folder-front: #F4CF78;
  --add: #E1F2D6; --del: #F8E2DC;
  --btn-top: #FFFFFF; --btn-bottom: #EEF2E4; --btn-hover-top: #FFFBE8; --btn-hover-bottom: #FFF0C2; --btn-hover-line: #C9A640;
  --bar-top: #A6D277; --bar-bottom: #84B856; --bar-line: #4F7F2E; --bar-ink: #18290D; --bar-field: #FBFAF0;
  --status-top: #4C7F31; --status-bottom: #3B6824; --status-ink: #F4F1DC; --status-line: #2C4F1A;
  --grass-1: #5E9E3A; --grass-2: #76B74A; --grass-3: #4E8B30; --grass-4: #6AAA43;
  --focus: #E0A526; --wood: #B08A3E; --parchment: #FFF8DC;
  --ui: "Segoe UI Variable Text", "Segoe UI", Tahoma, system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --mono: "Cascadia Mono", Consolas, "SF Mono", Menlo, "Liberation Mono", monospace;
  --pixel: "Pixelify Sans", "Silkscreen", var(--ui);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141914; --surface: #1A2119; --chrome: #263222; --chrome-2: #1F2A1B; --raised: #20291E;
  --ink: #ECF2E3; --muted: #A9B69C; --faint: #76836B; --line: #2D3A28; --line-strong: #4A5C40;
  --hover: #33311D; --hover-line: #6B5F2C; --select: #2B4622; --select-line: #5C8F3E;
  --accent: #8BD06E; --accent-ink: #0F1A0B; --group: #A6D98A;
  --ok: #7FCB6A; --redirect: #5FC2C2; --warn: #F0B54A; --err: #FF8E7A; --schema: #C6A0FF;
  --get: #7FCB6A; --post: #F0B54A; --put: #6FB8F0; --patch: #C6A0FF; --delete: #FF8E7A; --other: #A9B69C;
  --folder: #D9A93E; --folder-back: #B8892A; --folder-front: #E9C267;
  --add: #1E3524; --del: #3E2422;
  --btn-top: #2C3828; --btn-bottom: #243020; --btn-hover-top: #3B3A22; --btn-hover-bottom: #33321D; --btn-hover-line: #8A7A38;
  --bar-top: #3E6230; --bar-bottom: #304F23; --bar-line: #1C3112; --bar-ink: #EEF5E2; --bar-field: #1E281B;
  --status-top: #24381A; --status-bottom: #1B2D13; --status-ink: #DCE8C8; --status-line: #101C0A;
  --grass-1: #3F7228; --grass-2: #4F8A33; --grass-3: #35621F; --grass-4: #47802E;
  --focus: #E0A526; --wood: #8A6A2E; --parchment: #2E2A1C;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #141914; --surface: #1A2119; --chrome: #263222; --chrome-2: #1F2A1B; --raised: #20291E;
    --ink: #ECF2E3; --muted: #A9B69C; --faint: #76836B; --line: #2D3A28; --line-strong: #4A5C40;
    --hover: #33311D; --hover-line: #6B5F2C; --select: #2B4622; --select-line: #5C8F3E;
    --accent: #8BD06E; --accent-ink: #0F1A0B; --group: #A6D98A;
    --ok: #7FCB6A; --redirect: #5FC2C2; --warn: #F0B54A; --err: #FF8E7A; --schema: #C6A0FF;
    --get: #7FCB6A; --post: #F0B54A; --put: #6FB8F0; --patch: #C6A0FF; --delete: #FF8E7A; --other: #A9B69C;
    --folder: #D9A93E; --folder-back: #B8892A; --folder-front: #E9C267;
    --add: #1E3524; --del: #3E2422;
    --btn-top: #2C3828; --btn-bottom: #243020; --btn-hover-top: #3B3A22; --btn-hover-bottom: #33321D; --btn-hover-line: #8A7A38;
    --bar-top: #3E6230; --bar-bottom: #304F23; --bar-line: #1C3112; --bar-ink: #EEF5E2; --bar-field: #1E281B;
    --status-top: #24381A; --status-bottom: #1B2D13; --status-ink: #DCE8C8; --status-line: #101C0A;
    --grass-1: #3F7228; --grass-2: #4F8A33; --grass-3: #35621F; --grass-4: #47802E;
    --focus: #E0A526; --wood: #8A6A2E; --parchment: #2E2A1C;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--ui); display: grid; grid-template-rows: auto auto 1fr 24px; grid-template-columns: minmax(0, 1fr); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 1px dotted var(--ink); outline-offset: 1px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.hidden { display: none !important; }
.ic { width: 16px; height: 16px; flex: 0 0 16px; display: inline-block; vertical-align: -3px; }
.ic svg { width: 16px; height: 16px; display: block; }

/* Buttons: gently bevelled, with the classic pale-blue hover */
.btn { border: 1px solid var(--line-strong); background: linear-gradient(var(--btn-top), var(--btn-bottom)); border-radius: 3px; padding: 3px 11px; cursor: pointer; white-space: nowrap; line-height: 1.35; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: linear-gradient(var(--btn-hover-top), var(--btn-hover-bottom)); border-color: var(--btn-hover-line); }
.btn:active { background: var(--btn-hover-bottom); box-shadow: inset 0 1px 2px rgb(0 0 0 / 0.15); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.primary { background: linear-gradient(#2F86D6, #0B5CAD); border-color: #0A4F94; color: #fff; font-weight: 600; }
:root[data-theme="dark"] .btn.primary { background: linear-gradient(#3AA8E8, #1A7FC0); border-color: #1670AA; color: #001A2B; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { background: linear-gradient(#3AA8E8, #1A7FC0); border-color: #1670AA; color: #001A2B; } }
.btn.primary:hover { filter: brightness(1.07); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
.btn.quiet:hover { color: var(--ink); background: var(--hover); border-color: var(--hover-line); }
.btn.sm { padding: 1px 8px; font-size: 12px; }
.field { border: 1px solid var(--line-strong); background: var(--raised); border-radius: 2px; padding: 4px 7px; min-width: 0; box-shadow: inset 0 1px 1px rgb(0 0 0 / 0.06); }
.field:focus { border-color: var(--accent); outline: none; }
select.field { padding: 3px 5px; box-shadow: none; background: linear-gradient(var(--btn-top), var(--btn-bottom)); }
textarea.field { font-family: var(--mono); font-size: 12.5px; resize: vertical; width: 100%; }

.m { font-family: var(--mono); font-weight: 600; font-size: 11px; letter-spacing: 0.01em; }
.m-GET { color: var(--get); } .m-POST { color: var(--post); } .m-PUT { color: var(--put); } .m-PATCH { color: var(--patch); } .m-DELETE { color: var(--delete); } .m-HEAD, .m-OPTIONS { color: var(--other); }
.st { font-family: var(--mono); font-weight: 600; }
.st-2 { color: var(--ok); } .st-3 { color: var(--redirect); } .st-4 { color: var(--warn); } .st-5, .st-fail { color: var(--err); }

/* Command bar */
.cmdbar { display: flex; align-items: center; gap: 2px; padding: 5px 8px; background: linear-gradient(var(--chrome), var(--chrome-2)); border-bottom: 1px solid var(--line); min-width: 0; overflow-x: auto; scrollbar-width: none; }
.cmd { display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; background: none; border-radius: 3px; padding: 4px 8px; cursor: pointer; white-space: nowrap; color: var(--ink); }
.cmd:hover:not(:disabled) { background: var(--hover); border-color: var(--hover-line); }
.cmd:active:not(:disabled) { background: var(--select); border-color: var(--select-line); }
.cmd:disabled { opacity: 0.4; cursor: default; }
.cmd .lbl { font-size: 12.5px; }
.cmd.brand { font-weight: 700; gap: 7px; padding-right: 10px; cursor: default; }
.cmd.brand:hover { background: none; border-color: transparent; }
.cmd.brand .proj { font-weight: 400; color: var(--muted); }
.vsep { width: 1px; align-self: stretch; margin: 3px 5px; background: var(--line-strong); opacity: 0.5; }
.cmdbar .grow { flex: 1; min-width: 8px; }
.cmdbar label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; white-space: nowrap; padding: 0 4px; }
.cmdbar select.field { max-width: 170px; }

/* Address row */
.addr { display: flex; align-items: center; gap: 4px; padding: 5px 8px; border-bottom: 1px solid var(--line); background: var(--bg); }
.nav { width: 28px; height: 26px; border: 1px solid transparent; background: none; border-radius: 3px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); }
.nav:hover:not(:disabled) { background: var(--hover); border-color: var(--hover-line); }
.nav:disabled { opacity: 0.3; cursor: default; }
.crumbs { flex: 1; min-width: 0; display: flex; align-items: center; height: 28px; border: 1px solid var(--line-strong); border-radius: 2px; background: var(--raised); padding: 0 4px; overflow: hidden; box-shadow: inset 0 1px 1px rgb(0 0 0 / 0.05); }
.crumbs .ic { margin: 0 4px 0 3px; }
.crumb { border: 1px solid transparent; background: none; padding: 1px 5px; border-radius: 2px; cursor: pointer; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.crumb:hover { background: var(--hover); border-color: var(--hover-line); }
.crumb.last { cursor: default; } .crumb.last:hover { background: none; border-color: transparent; }
.chev { color: var(--faint); font-size: 10px; padding: 0 1px; flex: 0 0 auto; }
.search { width: min(260px, 32%); display: flex; align-items: center; height: 28px; border: 1px solid var(--line-strong); border-radius: 2px; background: var(--raised); padding: 0 7px; gap: 6px; box-shadow: inset 0 1px 1px rgb(0 0 0 / 0.05); }
.search:focus-within { border-color: var(--accent); }
.search input { border: 0; background: none; outline: none; flex: 1; min-width: 0; }
.search .ic { color: var(--muted); }

/* Main layout */
.main { display: grid; grid-template-columns: 270px 1fr; min-height: 0; }
.main.noside { grid-template-columns: minmax(0, 1fr); } /* the tree is removed from the grid, so the workspace needs the only column */
.main.noside .side { display: none; }
.side { border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.navtree { overflow: auto; flex: 1; padding: 4px 0 24px; }
.sec { display: flex; align-items: center; gap: 5px; margin-top: 6px; }
.sec .node { font-weight: 600; }
.sec .add { margin-right: 6px; border: 1px solid transparent; background: none; cursor: pointer; color: var(--muted); border-radius: 3px; padding: 0 4px; line-height: 1.2; font-size: 15px; }
.sec .add:hover { background: var(--hover); border-color: var(--hover-line); color: var(--ink); }
.sgroup { padding: 8px 12px 2px; color: var(--muted); font-size: 12px; }

/* Tree items: pale blue hover, blue-bordered selection */
.node { display: flex; align-items: center; gap: 5px; padding: 1px 6px 1px calc(6px + var(--d, 0) * 16px); cursor: pointer; border: 1px solid transparent; border-radius: 2px; background: none; width: calc(100% - 6px); margin: 0 3px; text-align: left; min-height: 24px; position: relative; }
.node:hover { background: var(--hover); border-color: var(--hover-line); }
.node.sel { background: var(--select); border-color: var(--select-line); }
.node .tw { width: 12px; color: var(--faint); flex: 0 0 12px; font-size: 9px; text-align: center; }
.node .tw:empty { visibility: hidden; }
.node .m { flex: 0 0 38px; text-align: left; font-size: 10px; }
.node .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node .aside { color: var(--faint); font-size: 11.5px; flex: 0 0 auto; }
.node .more { opacity: 0; border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 4px; border-radius: 3px; font-size: 14px; line-height: 1; }
.node:hover .more, .node:focus-within .more, .node .more:focus-visible { opacity: 1; }
.node .more:hover { background: var(--select-line); color: var(--ink); }
.node.dim { color: var(--muted); cursor: default; } .node.dim:hover { background: none; border-color: transparent; }
.node.warn { color: var(--warn); cursor: default; white-space: normal; font-size: 12px; } .node.warn:hover { background: none; border-color: transparent; }
.empty { padding: 14px 14px; color: var(--muted); }
.empty p { margin: 0 0 8px; }
.tag { font-size: 10.5px; padding: 0 4px; border-radius: 2px; background: var(--chrome-2); color: var(--muted); margin-right: 4px; }
.tag.agent { background: var(--select); color: var(--accent); }

/* Workspace and request tabs (classic raised tabs) */
.work { display: flex; flex-direction: column; min-width: 0; min-height: 0; container-type: inline-size; }
.tabs { display: flex; align-items: flex-end; gap: 2px; padding: 4px 6px 0; border-bottom: 1px solid var(--line-strong); background: var(--chrome-2); overflow-x: auto; scrollbar-width: thin; min-height: 33px; }
.tab { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px 0 10px; border: 1px solid var(--line-strong); border-bottom: 0; border-radius: 4px 4px 0 0; background: linear-gradient(var(--btn-top), var(--btn-bottom)); cursor: pointer; max-width: 220px; color: var(--muted); position: relative; flex: 0 0 auto; margin-bottom: 0; }
.tab:hover { background: linear-gradient(var(--btn-hover-top), var(--btn-hover-bottom)); }
.tab[aria-selected="true"] { background: var(--bg); color: var(--ink); height: 30px; margin-bottom: -1px; border-bottom: 1px solid var(--bg); }
.tab .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .x { border: 0; background: none; cursor: pointer; color: var(--faint); width: 18px; height: 18px; border-radius: 3px; line-height: 1; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; }
.tab .x:hover { background: #E81123; color: #fff; }
.tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: 0 0 7px; }
.tab.pinned .nm { font-weight: 600; }
.tabs .newtab { border: 1px solid transparent; background: none; cursor: pointer; width: 26px; height: 26px; margin-bottom: 2px; color: var(--muted); font-size: 16px; border-radius: 3px; }
.tabs .newtab:hover { color: var(--ink); background: var(--hover); border-color: var(--hover-line); }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }

/* Request bar */
.rbar { display: flex; gap: 6px; padding: 10px 12px 2px; align-items: flex-start; }
.rbar select.method { font-family: var(--mono); font-weight: 600; font-size: 12px; width: 96px; height: 30px; border: 1px solid var(--line-strong); border-radius: 2px; background: linear-gradient(var(--btn-top), var(--btn-bottom)); padding: 0 6px; }
.urlbox { flex: 1; min-width: 0; }
.urlwrap { position: relative; border: 1px solid var(--line-strong); border-radius: 2px; background: var(--raised); height: 30px; overflow: hidden; box-shadow: inset 0 1px 1px rgb(0 0 0 / 0.06); }
.urlwrap:focus-within { border-color: var(--accent); }
.urlwrap .hl, .urlwrap input { position: absolute; inset: 0; margin: 0; padding: 5px 8px; font-family: var(--mono); font-size: 12.5px; line-height: 18px; white-space: pre; border: 0; letter-spacing: 0; }
.urlwrap .hl { pointer-events: none; color: var(--ink); overflow: hidden; }
.urlwrap input { background: transparent; color: transparent; caret-color: var(--ink); outline: none; width: 100%; }
.urlwrap input::placeholder { color: var(--faint); }
.urlwrap input::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); color: transparent; }
.v-ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); border-radius: 2px; }
.v-bad { color: var(--err); background: color-mix(in srgb, var(--err) 12%, transparent); border-radius: 2px; }
.resolved { font-family: var(--mono); font-size: 11px; color: var(--muted); padding: 3px 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 18px; }
.resolved .bad { color: var(--err); }
.rbar .btn { height: 30px; }
.rbar .btn.primary { padding: 0 16px; }

/* Split: request | response */
.split { flex: 1; min-height: 0; display: grid; grid-template-rows: minmax(150px, 45%) 1fr; }
@container (min-width: 980px) { .split { grid-template-rows: 1fr; grid-template-columns: minmax(360px, 1fr) 1fr; } .split > .resp { border-left: 1px solid var(--line); border-top: 0; } }
.work[data-layout="stack"] .split { grid-template-columns: 1fr !important; grid-template-rows: minmax(150px, 45%) 1fr !important; }
.work[data-layout="stack"] .split > .resp { border-left: 0 !important; border-top: 1px solid var(--line) !important; }
.work[data-layout="side"] .split { grid-template-rows: 1fr !important; grid-template-columns: minmax(300px, 1fr) 1fr !important; }
.work[data-layout="side"] .split > .resp { border-left: 1px solid var(--line) !important; border-top: 0 !important; }
.reqp, .resp { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.resp { border-top: 1px solid var(--line); }
.subtabs { display: flex; gap: 0; padding: 0 8px; border-bottom: 1px solid var(--line); overflow-x: auto; flex: 0 0 auto; align-items: center; }
.subtab { border: 0; background: none; padding: 6px 9px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.subtab:hover { color: var(--ink); background: var(--hover); }
.subtab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.subtab .n { color: var(--faint); font-weight: 400; margin-left: 3px; }
.subtab .n.bad { color: var(--schema); }
.subtabs .grow { flex: 1; }
.pane { overflow: auto; padding: 12px 12px 30px; flex: 1; min-height: 0; }
.pane h3 { font-size: 12px; margin: 16px 0 6px; color: var(--group); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.pane h3::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.pane h3:first-child { margin-top: 0; }
.help { color: var(--muted); font-size: 12px; margin: 0 0 10px; max-width: 70ch; }

/* Key/value editor, styled like the Details view */
.kv { width: 100%; border-collapse: collapse; border: 1px solid var(--line); }
.kv th { text-align: left; font-weight: 400; color: var(--muted); font-size: 12px; padding: 3px 8px; background: var(--surface); border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
.kv th:last-child { border-right: 0; }
.kv td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; background: var(--raised); }
.kv td:last-child { border-right: 0; }
.kv tr:hover td { background: var(--hover); }
.kv td.c, .kv th.c { width: 28px; text-align: center; padding: 0; }
.kv td.d, .kv th.d { width: 28px; text-align: center; }
.kv input[type="text"] { width: 100%; border: 0; background: transparent; padding: 4px 8px; font-family: var(--mono); font-size: 12px; outline: none; }
.kv input[type="text"]:focus { background: var(--bg); box-shadow: inset 0 0 0 1px var(--accent); }
.kv tr.off input[type="text"] { color: var(--faint); text-decoration: line-through; }
.kv tr.ghost input[type="text"] { color: var(--faint); }
.kv .del { border: 0; background: none; cursor: pointer; color: var(--faint); font-size: 14px; }
.kv .del:hover { color: var(--err); }

.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 3px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; border-right: 1px solid var(--line-strong); background: linear-gradient(var(--btn-top), var(--btn-bottom)); padding: 2px 10px; cursor: pointer; font-size: 12px; }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: linear-gradient(var(--btn-hover-top), var(--btn-hover-bottom)); }
.seg button[aria-pressed="true"] { background: var(--select); box-shadow: inset 0 1px 2px rgb(0 0 0 / 0.12); font-weight: 600; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.grid2 { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 8px 10px; align-items: center; max-width: 640px; }
.grid2 label { color: var(--muted); }

/* Response */
.rstat { display: flex; gap: 14px; align-items: center; padding: 0 12px; min-height: 36px; border-bottom: 1px solid var(--line); flex-wrap: wrap; background: var(--surface); }
.rstat .st { font-size: 12.5px; }
.rstat .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

.toast { position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%); background: #FFFFE1; color: #000; border: 1px solid #767676; padding: 6px 12px; border-radius: 3px; z-index: 60; max-width: 80vw; box-shadow: 2px 2px 6px rgb(0 0 0 / 0.2); }

}

.dl-row.folder .dl-name .nm { font-weight: 600; }
.dl-url { font-size: 11.5px; color: var(--muted); }
.dl-foot { flex: 0 0 auto; border-top: 1px solid var(--line); padding: 2px 10px; font-size: 11.5px; color: var(--muted); background: var(--surface); }

.dtitle .grow { flex: 1; }

  .three { grid-template-columns: 1fr; }

/* ---- the feed ---- */
.feed { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ===== Meadow: a little colour, leaning green ===== */
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

:root[data-theme="dark"] .cmdbar .cmd:hover:not(:disabled) { background: rgb(255 255 255 / 0.12); border-color: rgb(255 255 255 / 0.25); }

.cmdbar .cmd:disabled { opacity: 0.45; }

.crumbs, .search { border-color: var(--line-strong); }

/* Navigation pane: sage, with pixel-font section headings */
.side { background: var(--surface); border-right: 2px solid var(--line-strong); }
.sec .node { font-family: var(--pixel); font-weight: 500; font-size: 13.5px; color: var(--group); letter-spacing: 0.01em; }
.node .tw { color: var(--muted); }

/* Primary actions in forest green */
.btn.primary { background: linear-gradient(#62B044, #2F7D32); border-color: #23612A; color: #fff; text-shadow: 0 1px 0 rgb(0 0 0 / 0.2); }
:root[data-theme="dark"] .btn.primary { background: linear-gradient(#6DBB4F, #3F8F35); border-color: #2C6A26; color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { background: linear-gradient(#6DBB4F, #3F8F35); border-color: #2C6A26; color: #fff; } }

/* Panels get a slightly chunkier frame */
.listpane { border-right: 2px solid var(--line-strong); }
.dl-head { background: linear-gradient(var(--chrome), var(--chrome-2)); border-bottom: 1px solid var(--line-strong); }

.dl-foot { background: var(--surface); }

.feed-bar, .rstat { background: var(--surface); }
.feed-bar strong, .sum-title h2, .dlg h2, .form h2, .runhead h2 { font-family: var(--pixel); font-weight: 500; letter-spacing: 0.01em; }
.feed-bar strong { font-size: 15px; color: var(--group); }
.feed-sep, .pane h3 { color: var(--group); }
.dlg h2 { background: linear-gradient(var(--bar-top), var(--bar-bottom)); color: var(--bar-ink); border-bottom: 2px solid var(--bar-line); font-size: 14px; }
dialog { border: 2px solid var(--bar-line); }
.menu { border: 2px solid var(--line-strong); }
.dtitle .nm { color: var(--ink); }

/* Status bar: deep forest green */
.status { background: linear-gradient(var(--status-top), var(--status-bottom)); border-top: 2px solid var(--status-line); color: var(--status-ink); }
.status > * { border-right-color: rgb(255 255 255 / 0.18); }
.status button { color: var(--status-ink); }

.status button[aria-pressed="true"] { background: rgb(255 255 255 / 0.22); border-color: rgb(255 255 255 / 0.4); color: #fff; }
.live.on i { background: #A6E36F; box-shadow: 0 0 0 2px rgb(166 227 111 / 0.25); }

/* Notifications: a little wooden sign */
.toast { background: var(--parchment); color: var(--ink); border: 2px solid var(--wood); border-radius: 3px; box-shadow: 0 3px 0 rgb(0 0 0 / 0.12), 2px 4px 10px rgb(0 0 0 / 0.18); }

/* Timeline (shared view) picks up the same frame */
.av-seg { border-width: 2px; }

.brand-ic { width: 16px; height: 16px; image-rendering: pixelated; flex: 0 0 16px; }
/* The pixel font's "fi" ligature makes words like "first" or "Profiles" hard to read. */

<script>

} catch {}

const parsed = (b) => { try { return JSON.parse(b); } catch { return undefined; } };
const hostOf = (u) => { try { return new URL(u).host; } catch { return ""; } };
const pathOf = (u) => { try { const x = new URL(u); return x.pathname + x.search; } catch { return u; } };
const isMac = navigator.platform.includes("Mac");
const MOD = isMac ? "⌘" : "Ctrl";

/* ============ state ============ */
const S = {
  info: null, cols: [], ops: [], specs: [], envs: [], sessions: [], calls: [], runs: new Map(), runSummaries: new Map(),
  tabs: [], active: null, side: store.get("side", "collections"), session: store.get("session", "default"),
  follow: store.get("follow", true), theme: store.get("theme", "auto"), index: new Map(), open: new Set(store.get("openNodes", [])),
  hq: "", hfilter: "all", selectedCall: null, auth: [],

let tabSeq = 0;
function blankRequest(over = {}) {
  return { method: "GET", url: "", pathVars: [], headers: [], body: { mode: "none", raw: "", fields: [], graphql: { query: "", variables: "" } }, auth: { type: "inherit" }, captures: [], expectStatus: "", scripts: { pre: "", test: "" }, description: "", ...over };
}

  out.scripts = { ...b.scripts, ...(r?.scripts || {}) };
  for (const k of ["pathVars", "headers", "captures"]) out[k] = Array.isArray(out[k]) ? out[k] : [];
  out.body.fields = Array.isArray(out.body.fields) ? out.body.fields : [];
  out.auth = out.auth || { type: "inherit" };
  return out;
}

/* ============ variables ============ */
function varsFor(tab) {
  const vars = {};
  const col = tab?.collectionId ? S.cols.find((c) => c.id === tab.collectionId) : null;
  for (const v of col?.variables || []) if (v.enabled !== false && v.key) vars[v.key] = v.value;
  const env = S.envs.find((e) => e.active);
  for (const v of env?.vars || []) if (v.enabled !== false && v.key) vars[v.key] = v.value;
  return vars;
}
const DYN = new Set(["$guid", "$randomUUID", "$timestamp", "$isoTimestamp", "$randomInt"]);
function resolveStr(s, vars, missing) {
  return String(s ?? "").replace(/\{\{\s*([$\w.\-]+)\s*\}\}/g, (m, k) => {

}

}

/* ============ query and path variables ============ */
function splitUrl(url) { const i = url.indexOf("?"); return i < 0 ? [url, ""] : [url.slice(0, i), url.slice(i + 1)]; }

  return q.split("&").filter(Boolean).map((p) => { const i = p.indexOf("="); return { key: i < 0 ? p : p.slice(0, i), value: i < 0 ? "" : p.slice(i + 1), enabled: true }; });
}

  const q = rows.filter((r) => r.enabled !== false && r.key).map((r) => (r.value === "" ? r.key : `${r.key}=${r.value}`)).join("&");

}

}

  const old = new Map(d.pathVars.map((p) => [p.key, p.value]));
  d.pathVars = names.map((k) => ({ key: k, value: old.get(k) ?? "" }));
}

/* ============ data loading ============ */
async function loadCollections() {
  S.cols = await api("/api/collections");
  S.index.clear();
  const walk = (items, colId, trail, ancestors) => {
    for (const it of items) {
      S.index.set(it.id, { item: it, collectionId: colId, trail: [...trail, it.name], ancestors });
      if (it.kind === "folder") walk(it.items || [], colId, [...trail, it.name], [...ancestors, it]);
    }
  };
  for (const c of S.cols) walk(c.items, c.id, [c.name], []);
}
async function loadEnvs() { S.envs = await api("/api/environments"); renderEnvSelect(); }
async function loadSessions() {
  S.sessions = await api("/api/sessions");
  const sel = $("#sessSel");
  const names = [...new Set(["default", ...S.sessions.map((s) => s.name)])];
  sel.innerHTML = names.map((n) => `<option ${n === S.session ? "selected" : ""}>${esc(n)}</option>`).join("") + `<option value="">None</option>`;
}
async function loadAuth() { S.auth = await api("/api/auth").catch(() => []); }

/* ---- sign-in (auth profiles from jodrell.config.json) ---- */
const untilText = (ts) => { const m = Math.round((new Date(ts) - Date.now()) / 60000); return m < 1 ? "under a minute" : m < 90 ? `${m} min` : m < 2880 ? `${Math.round(m / 60)} h` : `${Math.round(m / 1440)} days`; };
// A short label and a colour for each state.
function authLook(a) {
  if (!a) return { label: "", cls: "a-idle" };
  switch (a.state) {
    case "valid": return { label: a.expiresAt ? `Signed in, ${untilText(a.expiresAt)} left` : "Signed in", short: a.expiresAt ? untilText(a.expiresAt) : "Signed in", cls: "a-ok" };
    case "expiring": return { label: `Expires in ${untilText(a.expiresAt)}`, short: "Expires soon", cls: "a-warn" };
    case "expired": return { label: "Expired: signs in again on the next request", short: "Expired", cls: "a-warn" };
    case "rejected": return { label: "Token rejected: signs in again on the next request", short: "Rejected", cls: "a-warn" };
    case "failed": return { label: "Sign-in failed: needs you", short: "Needs you", cls: "a-err" };
    case "misconfigured": return { label: "Set-up problem: needs you", short: "Set-up problem", cls: "a-err" };

const authPill = (a, text) => { const l = authLook(a); return h("span", { class: "authpill " + l.cls, title: a?.message || "" }, text ?? l.label); };
const hostOfUrl = (u) => { try { return new URL(u).hostname.toLowerCase(); } catch { return ""; } };
const sameEndpoint = (a, b) => { try { const x = new URL(a), y = new URL(b); return x.origin === y.origin && x.pathname.replace(/\/$/, "") === y.pathname.replace(/\/$/, ""); } catch { return false; } };

function authFor(t) {
  if (!S.auth.length || t?.kind !== "request") return null;
  if (t.authName) { const a = S.auth.find((x) => x.name === t.authName); return a ? { a, login: true } : null; }
  const d = t.draft;
  let url = resolveStr(d.url, varsFor(t), new Set());
  for (const p of d.pathVars || []) if (p.key) url = url.replace(new RegExp(`/:${p.key}(?=/|\\?|#|$)`), "/x");
  if (url && !/^[a-z][a-z0-9+.-]*:\/\//i.test(url)) url = "https://" + url;
  for (const a of S.auth) if (a.login && a.login.method === d.method && sameEndpoint(a.login.url, url)) return { a, login: true };
  const op = t.opId ? S.ops.find((o) => o.id === t.opId) : null;
  if (op && Array.isArray(op.security) && !op.security.length) return null;
  const host = hostOfUrl(url);
  const a = S.auth.find((x) => (x.hosts || []).some((hh) => host === hh || host.endsWith("." + hh)) || (x.spec && op?.spec === x.spec) || (x.baseUrl && url.toLowerCase().startsWith(x.baseUrl.toLowerCase())));

  chip.className = "chip authchip " + (m.own ? "a-idle" : l.cls);

  wrap.append(h("div", { class: "authbox " + l.cls }, h("strong", { class: "authpill " + l.cls }, l.label), h("p", {}, a.message)));

    h("button", { class: "btn" + (a.needsAction || ["expired", "rejected", "none"].includes(a.state) ? " primary" : ""), disabled: busy, onclick: () => signInNow(a.name), title: "Sign in now, even if the token is still valid" }, icon("refresh"), a.token ? "Sign in again" : "Sign in now"),
    a.login ? h("button", { class: "btn", onclick: () => openSignInRequest(a.name), title: "Open the sign-in request to send it yourself, or change what it sends" }, icon("send"), "Open sign-in request") : null,
    a.loginCallId ? h("button", { class: "btn", onclick: () => openCall(a.loginCallId), title: "What was sent and what came back the last time" }, icon("clock"), "Show last sign-in") : null,
    a.token ? h("button", { class: "btn", onclick: async () => { if (!confirm(`Forget the token for ${a.name}? jodrell signs in again on the next request.`)) return; await api(`/api/auth/${encodeURIComponent(a.name)}`, { method: "DELETE" }); await loadAuth(); refreshAuthUi(); } }, "Sign out") : null));
  wrap.append(h("p", { class: "help" }, a.login
    ? "jodrell signs in by itself when a request needs it, and again when the token expires or the API rejects it. To try it by hand, open the sign-in request and press Send: if it works, jodrell keeps the new token."
    : "jodrell gets a token by itself when a request needs it, and again when it expires or the API rejects it."),
    h("p", { class: "help" }, 'To change how this signs in, edit "auth" in jodrell.config.json. Passwords and secrets come from .env or your environment, written as {{env.NAME}}.'));
  return wrap;
}
function renderEnvSelect() {

/* ============ sidebar ============ */

// spec:<source>, item:<request>, call:<history id>, op:<operation>, new:<n>, env:<id>, colset:<id>, run:<n>.
let newSeq = store.get("newSeq", 0);
S.docs = new Map();
S.sort = {};
S.listScroll = {};
const currentTab = () => (S.active ? S.docs.get(S.active) || null : null);
function keyFor(doc) {

}
function addTab(doc) { doc.key = keyFor(doc); if (!S.docs.has(doc.key)) S.docs.set(doc.key, doc); go(doc.key); return S.docs.get(doc.key); }
function activateTab(key) { go(key); }
// Expand the tree down to where you are, as Explorer does.
function revealInTree(key) {
  const t = S.docs.get(key);
  let cont = t ? (t.kind === "list" ? t.container : containerOf(t)) : null;
  if (t?.kind === "collection") cont = `c:${t.colId}`;
  if (!cont) return;
  if (cont.startsWith("spec:")) { closedSecs.delete("specs"); S.open.add(cont); }
  if (cont === "history") closedSecs.delete("history");
  if (cont.startsWith("f:") || cont.startsWith("c:")) {
    closedSecs.delete("collections");
    let ix = cont.startsWith("f:") ? S.index.get(Number(cont.slice(2))) : null;
    const colId = ix ? ix.collectionId : Number(cont.slice(2));
    S.open.add("c" + colId);
    while (ix) { S.open.add("f" + ix.item.id); ix = ix.item.parentId ? S.index.get(ix.item.parentId) : null; }
  }
  store.set("openNodes", [...S.open]);
}
function go(key, { replace = false } = {}) {
  S.active = key || null;
  if (S.active) revealInTree(S.active);

  renderView(); renderSideSoon(); persistDrafts();
}
function closeTab(key) { S.docs.delete(key); if (S.active === key) go(null); persistDrafts(); }

function isUnsaved(t) { return t?.kind === "request" && (isDirty(t) || (String(t.key).startsWith("new:") && !!t.draft.url)); }
const unsavedDocs = () => [...S.docs.values()].filter(isUnsaved);
function tabTitle(t) {
  if (t.kind === "request") return t.title || (t.draft.url ? pathOf(t.draft.url) || t.draft.url : "Untitled request");
  return t.title;
}
function renderTabs() { renderSideSoon(); }
function requestTab({ draft, title, itemId, collectionId, response, fromCall, opId }) {
  const d = normalise(draft);
  return { kind: "request", draft: d, title, itemId, collectionId, response, fromCall, opId, saved: JSON.stringify(d), reqTab: d.body.mode !== "none" ? "body" : "params", resTab: "body", bodyView: "tree", offParams: [] };
}

// Drafts are kept automatically, across restarts.
function persistDrafts() {
  store.set("drafts", unsavedDocs().map((t) => ({ key: t.key, draft: t.draft, saved: t.saved, title: t.title, itemId: t.itemId, collectionId: t.collectionId, fromCall: t.fromCall, opId: t.opId, responseId: t.response?.id })));

}

function restoreDrafts() {
  for (const s of store.get("drafts", [])) {
    const t = requestTab({ draft: s.draft, title: s.title, itemId: s.itemId, collectionId: s.collectionId, fromCall: s.fromCall, opId: s.opId });
    t.saved = s.saved; t.key = s.key;
    S.docs.set(t.key, t);
    if (s.responseId) api(`/api/calls/${s.responseId}`).then((c) => { t.response = c; if (S.active === t.key) renderView(); }).catch(() => {});
  }
}

// Build the document for a key when it's needed (links, back/forward, restarts).
async function ensureDoc(key) {

  if (key === "feed" || key === "timeline") { S.docs.set(key, { kind: key, key, title: key === "feed" ? "Feed" : "Timeline" }); return true; }
  if (key === "history" || key === "drafts" || key === "signin" || kind === "c" || kind === "f" || kind === "spec") { S.docs.set(key, { kind: "list", key, container: key }); return true; }
  if (kind === "auth") { if (!S.auth.some((a) => a.name === id)) await loadAuth(); if (!S.auth.some((a) => a.name === id)) return false; S.docs.set(key, { kind: "list", key, container: "signin", authName: id, title: id }); return true; }
  if (kind === "authreq") {
    const d = await api(`/api/auth/${encodeURIComponent(id)}/request`).catch(() => null);
    if (!d) return false;
    const t = requestTab({ draft: d, title: `Sign in: ${id}` });
    t.key = key; t.authName = id; S.docs.set(key, t); return true;
  }
  if (kind === "item") {
    const ix = S.index.get(Number(id));
    if (!ix || ix.item.kind !== "request") return false;
    const t = requestTab({ draft: clone(ix.item.request), title: ix.item.name, itemId: ix.item.id, collectionId: ix.collectionId });
    t.key = key; S.docs.set(key, t);
    lastCallFor(ix.item.id).then((c) => { if (c && !t.response) { t.response = c; if (S.active === key) renderView(); } });
    return true;
  }
  if (kind === "call") {
    const c = await api(`/api/calls/${id}`).catch(() => null);
    if (!c) return false;
    const t = requestTab({ draft: draftFromCall(c), title: (c.item_name?.split(" / ").pop() || pathOf(c.url)) + ` (#${c.id})`, collectionId: c.item_id ? S.index.get(c.item_id)?.collectionId : undefined, response: c, fromCall: c.id });
    t.key = key; S.docs.set(key, t); return true;
  }
  if (kind === "op") { const o = S.ops.find((x) => x.id === id); if (!o) return false; S.docs.set(key, opDoc(o)); return true; }
  if (kind === "env") { const e = S.envs.find((x) => x.id === Number(id)); if (!e) return false; S.docs.set(key, { kind: "env", key, envId: e.id, title: e.name, edit: clone(e) }); return true; }
  if (kind === "colset") { const c = S.cols.find((x) => x.id === Number(id)); if (!c) return false; S.docs.set(key, { kind: "collection", key, colId: c.id, title: c.name, edit: clone({ name: c.name, description: c.description, variables: c.variables, auth: c.auth }) }); return true; }

}
async function openKey(key, opts) { if (await ensureDoc(key)) go(key, opts); else toast("That no longer exists"); }
async function lastCallFor(itemId) { const c = S.calls.find((x) => x.item_id === itemId); return c ? api(`/api/calls/${c.id}`).catch(() => null) : null; }

// Which list a document lives in (the middle pane), and what's above that.
function containerOf(t) {
  if (!t) return null;
  if (t.kind === "list") return t.container;
  if (t.kind !== "request") return null;
  if (t.authName) return "signin";
  if (t.itemId) { const ix = S.index.get(t.itemId); if (ix) return ix.item.parentId ? `f:${ix.item.parentId}` : `c:${ix.collectionId}`; }
  if (t.opId) { const o = S.ops.find((x) => x.id === t.opId); const sp = o && S.specs.find((s) => s.title === o.spec); if (sp) return `spec:${sp.source}`; }
  if (t.fromCall) return "history";
  return "drafts";
}
function parentOf(key) {
  const t = S.docs.get(key);
  if (t && t.kind !== "list") return containerOf(t) || null;
  if (String(key).startsWith("f:")) { const ix = S.index.get(Number(key.slice(2))); if (ix) return ix.item.parentId ? `f:${ix.item.parentId}` : `c:${ix.collectionId}`; }
  if (t?.kind === "collection") return `c:${t.colId}`;
  return null; // collections, specs, history and drafts sit at the top: up goes home (the feed)
}

async function openItem(id) { if (!S.index.has(id)) await loadCollections().catch(() => {}); openKey(`item:${id}`); }
function opDoc(o) {
  const url = (o.baseUrl || "{{baseUrl}}").replace(/\/$/, "") + o.path.replace(/\{([^}]+)\}/g, ":$1");
  const d = blankRequest({ method: o.method, url });
  syncPathVars(d);
  const q = o.params.filter((p) => p.in === "query");
  if (q.length) d.url = withQuery(d.url, q.filter((p) => p.required).map((p) => ({ key: p.name, value: "", enabled: true })));
  for (const p of o.params.filter((p) => p.in === "header")) d.headers.push({ key: p.name, value: "", enabled: !!p.required });
  if (o.requestBody?.schema) { d.body.mode = "json"; d.body.raw = JSON.stringify(skeleton(o.requestBody.schema), null, 2); }
  d.description = o.summary || "";
  const t = requestTab({ draft: d, title: o.summary || o.id, opId: o.id });
  t.key = `op:${o.id}`;

}
function openOperation(o) { if (!S.docs.has(`op:${o.id}`)) S.docs.set(`op:${o.id}`, opDoc(o)); go(`op:${o.id}`); }
function openCall(id) { S.selectedCall = id; openKey(`call:${id}`); }

function skeleton(schema, depth = 0) {

  const s = schema.allOf ? Object.assign({}, ...schema.allOf) : schema.oneOf?.[0] || schema.anyOf?.[0] || schema;
  if (s.type === "object" || s.properties) return Object.fromEntries(Object.entries(s.properties || {}).map(([k, v]) => [k, skeleton(v, depth + 1)]));

}

    .filter(([k, v]) => !String(v).includes("••••") && !/^(accept|user-agent|content-length|cookie)$/i.test(k))

// The agent made a request. In the feed and timeline it just appears; while you're
// browsing history it's selected; if you're working on something, you get a note.
function followAgent(c) {
  const t = currentTab();
  if (!t || t.kind === "feed" || t.kind === "timeline") return;
  const inHistory = (t.kind === "list" && t.container === "history") || (t.kind === "request" && t.fromCall && !isDirty(t));
  if (inHistory) return openCall(c.id);

/* ============ main view ============ */
function renderView() {

  const v = $("#view");
  S.listEl = null;

  if (t.kind === "timeline") return v.replaceChildren(timelineView(t));

  if (t.kind === "env") return v.replaceChildren(envView(t));

  const det = h("div", { class: "detail" });

  renderList(list, cont, sel?.key || (t.authName ? `auth:${t.authName}` : undefined));

let listTimer;

function changed(t, opts = {}) {

  if (opts.url !== false) updateUrlBar(t);
  if (opts.counts !== false) updateCounts(t);
  persistTabsSoon();

// While typing: refresh the draft marker, the Revert button, and the dots in the list and tree.

  const d = isDirty(t), e = t._els || {};

  if (e.revert) e.revert.hidden = !d && !String(t.key).startsWith("new:");
  if (e.titleEl) e.titleEl.textContent = tabTitle(t);
  document.querySelectorAll(`[data-row="${CSS.escape(t.key)}"]`).forEach((r) => r.classList.toggle("dirty", d));
  renderSideSoon();

/* ---- the middle pane: a Details-style list ---- */

function listModel(cont) {

  const last = lastByItem();
  if (cont.startsWith("c:") || cont.startsWith("f:")) {

    const items = node?.items || [];

      title: node?.name || "Missing", empty: "This folder is empty. Use New request, or save a request here.",
      cols: [["Name", "minmax(150px, 1.4fr)"], ["URL", "minmax(90px, 1fr)"], ["Last result", "80px"], ["Last sent", "86px"]],
      rows: items.filter((it) => (it.kind === "folder" ? true : hit(it.name, it.request?.url))).map((it) => it.kind === "folder"
        ? { key: `f:${it.id}`, folder: true, sort: [it.name.toLowerCase(), "", -1, 0], cells: [nameCell([icon("folder"), h("span", { class: "nm" }, it.name)]), h("span", { class: "muted" }, `${countReqs(it.items || [])} request${countReqs(it.items || []) === 1 ? "" : "s"}`), "", ""] }
        : (() => { const lc = last.get(it.id), d = S.docs.get(`item:${it.id}`); return { key: `item:${it.id}`, dirty: isDirty(d), sort: [it.name.toLowerCase(), shortUrl(it.request?.url), lc?.status ?? 0, lc ? new Date(lc.ts).getTime() : 0],

      cols: [["Name", "minmax(150px, 1.3fr)"], ["Path", "minmax(120px, 1fr)"]],
      rows: S.ops.filter((o) => o.spec === sp?.title && hit(o.id, o.path, o.summary)).map((o) => ({ key: `op:${o.id}`, dirty: isDirty(S.docs.get(`op:${o.id}`)), sort: [(o.summary || o.id).toLowerCase(), o.path],

      rows: S.calls.filter((c) => hit(c.url, c.item_name, c.note, c.status)).slice(0, 500).map((c) => ({ key: `call:${c.id}`, sort: [new Date(c.ts).getTime(), (c.item_name || c.url).toLowerCase(), c.status || 0, c.duration_ms || 0, c.source],

        cells: [h("span", { class: "mono muted" }, new Date(c.ts).toDateString() === new Date().toDateString() ? clock(c.ts).slice(0, 5) : new Date(c.ts).toLocaleDateString("en-GB", { day: "numeric", month: "short" })),
          nameCell([h("span", { class: "m m-" + c.method }, c.method), h("span", { class: "nm" }, c.item_name ? c.item_name.split(" / ").pop() : pathOf(c.url))]), statusCell(c), h("span", { class: "muted" }, `${c.duration_ms ?? ""} ms`), c.source === "agent" ? h("span", { class: "tag agent" }, "Agent") : h("span", { class: "muted" }, "You")] })),

      rows: S.auth.filter((a) => hit(a.name, a.spec, ...(a.hosts || []))).map((a) => ({ key: `auth:${a.name}`, sort: [a.name.toLowerCase(), a.state, a.spec || ""], title: a.message,

      rows: unsavedDocs().filter((t) => hit(tabTitle(t), t.draft.url)).map((t) => ({ key: t.key, dirty: true, sort: [tabTitle(t).toLowerCase(), where(t), shortUrl(t.draft.url)],

function renderList(el, cont, selKey) {
  S.listEl = el; S.listCont = cont;
  const m = listModel(cont);

  let rows = m.rows;
  if (sort) rows = [...rows].sort((a, b) => (a.folder !== b.folder ? (a.folder ? -1 : 1) : (a.sort[sort.col] > b.sort[sort.col] ? 1 : a.sort[sort.col] < b.sort[sort.col] ? -1 : 0) * sort.dir));

    h("button", { class: "dl-col", role: "columnheader", "aria-sort": sort?.col === i ? (sort.dir > 0 ? "ascending" : "descending") : "none", onclick: () => { const cur = S.sort[cont] || m.defaultSort; S.sort[cont] = { col: i, dir: cur?.col === i ? -cur.dir : 1 }; renderList(el, cont, selKey); } },
      label, sort?.col === i ? h("span", { class: "dl-arrow" }, sort.dir > 0 ? "▲" : "▼") : null)));

      onclick: () => openKey(r.key), ondblclick: () => { if (!r.folder) setTimeout(() => $(".urlwrap input")?.focus(), 50); } }, ...r.cells.map((c) => h("span", { class: "dl-cell" }, c))));
  }
  if (!rows.length) body.append(h("div", { class: "empty" }, m.empty));

    const reqRows = rows.filter((r) => !r.folder);
    const i = reqRows.findIndex((r) => r.key === selKey);
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const next = reqRows[Math.max(0, Math.min(reqRows.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)))];
      if (next && next.key !== selKey) openKey(next.key, { replace: true }).then(() => setTimeout(() => $(".dl-body")?.focus({ preventScroll: true }), 0));
    }

  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = async (e) => { e.preventDefault(); drop.classList.remove("over"); for (const f of e.dataTransfer.files) await handle(await f.text()); };
  const paste = h("textarea", { class: "field", style: "min-height:90px", placeholder: "Or paste the exported JSON here" });
  body.replaceChildren(h("h2", {}, "Import"), drop, file, paste, out,
    h("p", { class: "help", style: "margin:0" }, "To bring in a single request, paste a curl command into the URL bar instead."),
    h("div", { class: "foot" }, h("button", { class: "btn", onclick: () => $("#dlg").close() }, "Close"), h("button", { class: "btn primary", onclick: () => paste.value.trim() && handle(paste.value) }, "Import pasted JSON")));
  $("#dlg").showModal();
}
$("#importBtn").onclick = openImport;
$("#timelineBtn").onclick = openTimeline;

/* ============ live updates ============ */
function connect() {
  const live = $("#live");
  const es = new EventSource("/api/events");
  es.onopen = () => { live.classList.add("on"); live.lastChild.textContent = "Connected"; };
  es.onerror = () => { live.classList.remove("on"); live.lastChild.textContent = "Reconnecting"; };
  es.addEventListener("call", async (e) => {
    const c = JSON.parse(e.data);
    if (S.calls.some((x) => x.id === c.id)) return;
    S.calls.unshift(c);
    updateCount();
    refreshTimelineSoon();
    renderSideSoon();
    if (!currentTab() || currentTab().kind === "feed") feedAppend(c);
    if (S.listEl?.isConnected) refreshListSoon();
    if (c.source === "agent" && S.follow) followAgent(c);
    const runTab = [...S.docs.values()].find((t) => t.kind === "run" && (t.runId === c.run_id || (t.pending && !t.runId && S.runs.get(c.run_id)?.name?.startsWith("Run:"))));
    if (runTab) { if (!runTab.runId) { runTab.runId = c.run_id; runTab.pending = false; } if (S.active === runTab.key) renderView(); }
  });
  es.addEventListener("run", (e) => { const r = JSON.parse(e.data); S.runs.set(r.id, r); });
  es.addEventListener("rundone", (e) => {
    const r = JSON.parse(e.data); S.runSummaries.set(r.runId, r);
    const t = [...S.docs.values()].find((x) => x.kind === "run" && (x.runId === r.runId || (x.pending && !x.runId)));
    if (S.listEl?.isConnected) refreshListSoon();
    if (t) { t.runId = r.runId; t.pending = false; if (S.active === t.key) renderView(); }
    toast(`${r.name}: ${r.passed} of ${r.total} passed`);
  });
  es.addEventListener("runerror", (e) => toast(JSON.parse(e.data).error));
  es.addEventListener("collections", async () => { await loadCollections(); renderSideSoon(); refreshListSoon(); });
  es.addEventListener("environments", async () => { await loadEnvs(); renderSideSoon(); const t = currentTab(); if (t?.kind === "request") updateUrlBar(t); if (t?.kind === "env") renderView(); });
  es.addEventListener("session", async () => { await loadSessions(); renderSideSoon(); });
  es.addEventListener("auth", async () => { await loadAuth(); refreshAuthUi(); });
  es.addEventListener("specs", async () => { [S.ops, S.specs] = await Promise.all([api("/api/operations"), api("/api/specs")]); renderSideSoon(); });
  es.addEventListener("cleared", () => { S.calls = []; S.runs.clear(); updateCount(); renderSide(); });
}
function updateCount() {
  const today = new Date().toDateString();
  const n = S.calls.filter((c) => new Date(c.ts).toDateString() === today).length;
  const a = S.calls.filter((c) => c.source === "agent" && new Date(c.ts).toDateString() === today).length;
  $("#count").textContent = `${n} request${n === 1 ? "" : "s"} today${a ? `, ${a} by your agent` : ""}`;
}

/* ============ chrome: theme, sidebar, keys ============ */
function applyTheme() {
  if (S.theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = S.theme;
  $("#themeBtn").textContent = `Theme: ${S.theme}`;
}
$("#themeBtn").onclick = () => { S.theme = { auto: "dark", dark: "light", light: "auto" }[S.theme]; store.set("theme", S.theme); applyTheme(); };
$("#follow").checked = S.follow;
$("#follow").onchange = (e) => { S.follow = e.target.checked; store.set("follow", S.follow); };
$("#toggleSide").onclick = () => { $("#main").classList.toggle("noside"); store.set("noside", $("#main").classList.contains("noside")); };
document.addEventListener("keydown", (e) => {
  const mod = isMac ? e.metaKey : e.ctrlKey;
  if (mod && e.key === "Enter") { e.preventDefault(); sendTab(currentTab()); }
  if (mod && (e.key === "s" || e.key === "S")) { e.preventDefault(); saveTab(currentTab()); }
});
window.addEventListener("beforeunload", persistTabs);

/* ============ Explorer chrome ============ */
const navHist = { stack: [], pos: -1, moving: false };
function noteNav(key) {
  if (navHist.moving) return;
  if (navHist.stack[navHist.pos] === key) return;
  navHist.stack = navHist.stack.slice(0, navHist.pos + 1).concat(key);
  navHist.pos = navHist.stack.length - 1;
}
async function goNav(delta) {
  let p = navHist.pos + delta;
  while (p >= 0 && p < navHist.stack.length) {
    const k = navHist.stack[p];
    if (await ensureDoc(k)) {
      navHist.pos = p; navHist.moving = true;
      go(k);
      navHist.moving = false; return;
    }
    p += delta;
  }
}
function crumbsFor(t) {
  const P = [S.info?.project || "project", () => go(null)];
  const colCrumbs = (colId, folderIds) => {
    const col = S.cols.find((c) => c.id === colId);
    return [["Collections"], [col?.name || "Collection", () => openKey(`c:${colId}`)], ...folderIds.map((id) => [S.index.get(id)?.item.name || "Folder", () => openKey(`f:${id}`)])];
  };
  const folderChain = (id) => { const out = []; let ix = S.index.get(id); while (ix) { out.unshift(ix.item.id); ix = ix.item.parentId ? S.index.get(ix.item.parentId) : null; } return out; };
  if (!t || t.kind === "feed") return { ic: "feed", parts: [P, ["Feed"]] };
  if (t.kind === "timeline") return { ic: "clock", parts: [P, ["Timeline"]] };
  if (t.kind === "env") return { ic: "globe", parts: [P, ["Environments"], [t.title]] };
  if (t.kind === "collection") return { ic: "cabinet", parts: [P, ...colCrumbs(t.colId, []), ["Variables and auth"]] };
  if (t.kind === "run") return { ic: "run", parts: [P, ["Collections"], [t.title]] };
  const cont = t.kind === "list" ? t.container : containerOf(t);
  const leaf = t.kind === "request" ? [[tabTitle(t)]] : [];
  if (cont?.startsWith("c:")) return { ic: "folderOpen", parts: [P, ...colCrumbs(Number(cont.slice(2)), []), ...leaf] };
  if (cont?.startsWith("f:")) { const fid = Number(cont.slice(2)); return { ic: "folderOpen", parts: [P, ...colCrumbs(S.index.get(fid)?.collectionId, folderChain(fid)), ...leaf] }; }
  if (cont?.startsWith("spec:")) { const sp = S.specs.find((x) => `spec:${x.source}` === cont); return { ic: "spec", parts: [P, ["API specs"], [sp?.title || "Spec", () => openKey(cont)], ...leaf] }; }
  if (cont === "history") return { ic: "clock", parts: [P, ["History", () => openKey("history")], ...leaf] };
  if (cont === "signin") { const nm = t.authName; return { ic: "key", parts: [P, ["Sign-in", () => openKey("signin")], ...(nm ? [[nm, t.kind === "request" ? () => openKey(`auth:${nm}`) : null]] : []), ...leaf] }; }
  return { ic: "newdoc", parts: [P, ["Unsaved requests", () => openKey("drafts")], ...leaf] };
}
function updateChrome() {
  const t = currentTab();
  const { ic, parts } = crumbsFor(t);
  const el = $("#crumbs");
  el.replaceChildren(icon(ic));
  parts.forEach(([label, fn], i) => {
    if (i) el.append(h("span", { class: "chev", "aria-hidden": "true" }, "›"));
    const last = i === parts.length - 1;
    el.append(h("button", { class: "crumb" + (last || !fn ? " last" : ""), title: label, onclick: !last && fn ? fn : null, tabindex: !last && fn ? 0 : -1 }, label));
  });
  const isReq = t?.kind === "request";
  $("#cmdSave").disabled = !isReq;
  $("#cmdSend").disabled = !isReq || !!t.sending;
  const colId = t?.kind === "collection" ? t.colId : isReq ? (t.itemId ? S.index.get(t.itemId)?.collectionId : t.collectionId) : null;
  $("#cmdRun").disabled = !colId;
  $("#cmdRun").dataset.col = colId || "";
  $("#navBack").disabled = navHist.pos <= 0;
  $("#navFwd").disabled = navHist.pos >= navHist.stack.length - 1;
  $("#navUp").disabled = !t || t.kind === "feed";
  const env = S.envs.find((e) => e.active);
  $("#envStatus").textContent = env ? `Environment: ${env.name}` : "No environment";
  $("#envStatus").hidden = false;
}
$("#cmdNew").onclick = () => addTab(requestTab({ draft: blankRequest() }));
$("#cmdSave").onclick = () => saveTab(currentTab());
$("#cmdSend").onclick = () => sendTab(currentTab());
$("#cmdRun").onclick = () => { const c = Number($("#cmdRun").dataset.col); if (c) runCollection(c); };
$("#cmdExport").onclick = async () => { try { const r = await api("/api/report", { method: "POST", body: { since: "all" } }); toast(`Saved the HTML report to ${r.file}`); } catch (e) { toast(e.message); } };
$("#navBack").onclick = () => goNav(-1);
$("#navFwd").onclick = () => goNav(1);
$("#navUp").onclick = () => { const up = S.active ? parentOf(S.active) : null; if (up) openKey(up); else go(null); };
$("#navRefresh").onclick = async () => {
  try {
    await api("/api/specs/reload", { method: "POST" }).catch(() => {});
    const [calls, runs] = await Promise.all([api("/api/calls?limit=2000"), api("/api/runs"), loadCollections(), loadEnvs(), loadSessions(), loadAuth()]);
    S.calls = calls; runs.forEach((r) => S.runs.set(r.id, r));
    renderSide(); renderView(); updateCount(); toast("Refreshed");
  } catch (e) { toast(e.message); }
};
let searchTimer;
$("#searchBox").oninput = (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    S.cq = e.target.value;
    renderSide();
    const t = currentTab();
    if (!t || t.kind === "feed") { S.feed.limit = 60; renderView(); }
    else if (t.kind === "list" || t.kind === "request") refreshListSoon();
    if (t?.kind === "timeline") { timelineState.av = { range: "all", who: "all", ...(timelineState.av || {}), q: S.cq }; renderView(); }
  }, 150);
};
function applyLayout() {
  const l = store.get("layout", "auto");
  if (l === "auto") $("#work").removeAttribute("data-layout"); else $("#work").dataset.layout = l;
  $("#layoutSide").setAttribute("aria-pressed", l === "side");
  $("#layoutStack").setAttribute("aria-pressed", l === "stack");
}
$("#layoutSide").onclick = () => { store.set("layout", store.get("layout", "auto") === "side" ? "auto" : "side"); applyLayout(); };
$("#layoutStack").onclick = () => { store.set("layout", store.get("layout", "auto") === "stack" ? "auto" : "stack"); applyLayout(); };
document.addEventListener("keydown", (e) => {
  if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); goNav(-1); }
  if (e.altKey && e.key === "ArrowRight") { e.preventDefault(); goNav(1); }
  if (e.key === "F5") { e.preventDefault(); $("#navRefresh").click(); }
  if ((isMac ? e.metaKey : e.ctrlKey) && (e.key === "n" || e.key === "N") && !e.shiftKey) { e.preventDefault(); $("#cmdNew").click(); }
});

/* ============ start ============ */
async function init() {
  paintIcons(); applyLayout();
  applyTheme();
  if (store.get("noside", innerWidth < 720)) $("#main").classList.add("noside");
  const [info, ops, runs, calls, specsList] = await Promise.all([api("/api/info"), api("/api/operations"), api("/api/runs"), api("/api/calls?limit=2000"), api("/api/specs"), loadCollections(), loadEnvs(), loadSessions(), loadAuth()]);
  S.specs = specsList;
  S.info = info; S.ops = ops; S.calls = calls;
  if (info.project) { document.title = `jodrell – ${info.project}`; $("#projName").textContent = info.project; }
  if (store.get("openNodes", null) === null) { for (const c of S.cols) S.open.add("c" + c.id); S.open.add("spec"); store.set("openNodes", [...S.open]); }
  runs.forEach((r) => S.runs.set(r.id, r));
  restoreDrafts();
  const fromHash = +(location.hash.match(/call-(\d+)/)?.[1] || 0);
  const lastKey = store.get("lastKey", null);
  if (fromHash) await ensureDoc(`call:${fromHash}`) && (S.active = `call:${fromHash}`);
  else if (lastKey && await ensureDoc(lastKey).catch(() => false)) S.active = lastKey;
  navHist.stack = [S.active]; navHist.pos = 0;
  renderSide(); renderView(); updateCount(); updateAuthStatus();
  // Keep "expires in" and expired states current without waiting for an event.
  setInterval(() => { if (S.auth.length) loadAuth().then(refreshAuthUi); }, 30000);
  connect();
}
window.addEventListener("hashchange", () => { const id = +(location.hash.match(/call-(\d+)/)?.[1] || 0); if (id) openCall(id); });
init().catch((e) => { $("#view").replaceChildren(h("div", { class: "placeholder" }, h("p", { style: "color:var(--err)" }, `jodrell couldn't load: ${e.message}`), h("p", {}, "Is \"jodrell dev\" still running?"))); });
</script>
